<script>
/* Decide before first paint whether to play the welcome intro: once per
   browser session, never with reduced motion; add ?intro to the URL to replay. */
(function () {
  try {
    if (new URLSearchParams(location.search).has('intro')) sessionStorage.removeItem('introSeen');
    if (!sessionStorage.getItem('introSeen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('intro-play');
    }
  } catch (e) {}
})();
</script>
